services:
  flask:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zafer-flask
    expose:
      - "5000"
    volumes:
      - ./app/data:/app/app/data
      - ./src:/app/src:ro
    environment:
      - SECRET_KEY=zafer-karaca-secret-2026
      - INSIGHTMAP_AI_URL=${INSIGHTMAP_AI_URL:-https://insightmap.tr}
      - INSIGHTMAP_AI_SERVICE_KEY=${INSIGHTMAP_AI_SERVICE_KEY:-}
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: zafer-nginx
    ports:
      - "8024:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./src:/usr/share/nginx/html:ro
    depends_on:
      - flask
    restart: unless-stopped